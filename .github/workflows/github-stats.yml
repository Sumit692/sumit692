name: Update GitHub Profile Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Profile Graphics

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Sumit692

        run: |

          python3 <<'PY'

          import os
          import json
          import urllib.request
          from datetime import date, timedelta


          # =========================================================
          # CONFIG
          # =========================================================

          USERNAME = os.environ["USERNAME"]
          TOKEN = os.environ["GITHUB_TOKEN"]

          API = "https://api.github.com/graphql"


          # =========================================================
          # GITHUB GRAPHQL
          # =========================================================

          query = """
          query($login:String!) {

            user(login:$login) {

              followers {
                totalCount
              }

              repositories(
                first:100
                ownerAffiliations:OWNER
                privacy:PUBLIC
                isFork:false
              ) {

                nodes {

                  stargazerCount

                  forkCount

                  primaryLanguage {
                    name
                  }

                }

              }

              contributionsCollection {

                totalCommitContributions

                totalIssueContributions

                totalPullRequestContributions

                contributionCalendar {

                  totalContributions

                  weeks {

                    contributionDays {

                      date

                      contributionCount

                    }

                  }

                }

              }

            }

          }
          """


          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": USERNAME
              }
          }).encode("utf-8")


          request = urllib.request.Request(

              API,

              data=payload,

              headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Profile-Stats"
              }

          )


          with urllib.request.urlopen(request) as response:

              result = json.load(response)


          if "errors" in result:

              raise Exception(
                  json.dumps(result["errors"])
              )


          user = result["data"]["user"]

          repos = user["repositories"]["nodes"]

          collection = user["contributionsCollection"]

          calendar = collection["contributionCalendar"]


          # =========================================================
          # BASIC STATISTICS
          # =========================================================

          repository_count = len(repos)


          stars = sum(
              repo["stargazerCount"]
              for repo in repos
          )


          forks = sum(
              repo["forkCount"]
              for repo in repos
          )


          followers = user["followers"]["totalCount"]


          contributions = calendar["totalContributions"]


          commits = collection[
              "totalCommitContributions"
          ]


          issues = collection[
              "totalIssueContributions"
          ]


          pull_requests = collection[
              "totalPullRequestContributions"
          ]


          # =========================================================
          # LANGUAGES
          # =========================================================

          languages = {}


          for repo in repos:

              language = repo.get(
                  "primaryLanguage"
              )

              if language:

                  name = language.get("name")

                  if name:

                      languages[name] = (
                          languages.get(name, 0) + 1
                      )


          top_languages = sorted(
              languages.items(),
              key=lambda x: x[1],
              reverse=True
          )[:5]


          language_text = " • ".join(
              name
              for name, count
              in top_languages
          )


          # =========================================================
          # CONTRIBUTION DAYS
          # =========================================================

          days = []


          for week in calendar["weeks"]:

              for contribution_day in week["contributionDays"]:

                  days.append({

                      "date": date.fromisoformat(
                          contribution_day["date"]
                      ),

                      "count":
                          contribution_day[
                              "contributionCount"
                          ]

                  })


          days.sort(
              key=lambda x: x["date"]
          )


          # =========================================================
          # HIGHEST STREAK
          # =========================================================

          highest_streak = 0

          running_streak = 0

          previous_date = None


          for day in days:

              if day["count"] > 0:

                  if (

                      previous_date is not None

                      and

                      (
                          day["date"]
                          - previous_date
                      ).days == 1

                  ):

                      running_streak += 1

                  else:

                      running_streak = 1


                  highest_streak = max(
                      highest_streak,
                      running_streak
                  )


                  previous_date = day["date"]


              else:

                  running_streak = 0

                  previous_date = None


          # =========================================================
          # CURRENT STREAK
          # =========================================================

          current_streak = 0

          today = date.today()


          # Create a dictionary for easy lookup

          contribution_map = {

              item["date"]: item["count"]

              for item in days

          }


          check_date = today


          # If today has no contribution,
          # GitHub streak can still be alive from yesterday.

          if contribution_map.get(
              today,
              0
          ) == 0:

              check_date = (
                  today
                  - timedelta(days=1)
              )


          while contribution_map.get(
              check_date,
              0
          ) > 0:

              current_streak += 1

              check_date -= timedelta(days=1)


          # =========================================================
          # COLORS
          # =========================================================

          BG = "#0D1117"

          CARD = "#111820"

          BORDER = "#26323A"

          TEXT = "#E6EDF3"

          MUTED = "#8B949E"

          TEAL = "#00FFD5"

          TEAL_DARK = "#003B35"

          EMPTY = "#161B22"


          # =========================================================
          # HELPER
          # =========================================================

          def escape(value):

              return (

                  str(value)

                  .replace("&", "&amp;")

                  .replace("<", "&lt;")

                  .replace(">", "&gt;")

                  .replace('"', "&quot;")

              )


          # =========================================================
          # STATISTICS CARD
          # =========================================================

          width = 760

          height = 360


          stats_svg = f'''

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="{width}"
            height="{height}"
            viewBox="0 0 {width} {height}"
          >

            <rect
              width="100%"
              height="100%"
              rx="20"
              fill="{BG}"
            />

            <rect
              x="1"
              y="1"
              width="{width-2}"
              height="{height-2}"
              rx="20"
              fill="none"
              stroke="{BORDER}"
              stroke-width="2"
            />


            <style>

              .title {{
                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;

                font-size:24px;

                font-weight:700;

                fill:{TEXT};
              }}


              .label {{
                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;

                font-size:13px;

                font-weight:600;

                fill:{MUTED};
              }}


              .value {{
                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;

                font-size:22px;

                font-weight:700;

                fill:{TEAL};
              }}


              .streak {{
                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;

                font-size:24px;

                font-weight:800;

                fill:{TEAL};
              }}


              .small {{
                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;

                font-size:12px;

                font-weight:500;

                fill:{MUTED};
              }}

            </style>


            <!-- HEADER -->

            <text
              x="32"
              y="42"
              class="title"
            >
              GitHub Statistics
            </text>


            <text
              x="32"
              y="65"
              class="small"
            >
              @Sumit692
            </text>


            <!-- STAT CARDS -->

            <rect
              x="25"
              y="85"
              width="165"
              height="78"
              rx="12"
              fill="{CARD}"
              stroke="{BORDER}"
            />

            <text
              x="42"
              y="111"
              class="label"
            >
              Repositories
            </text>

            <text
              x="42"
              y="143"
              class="value"
            >
              {repository_count}
            </text>



            <rect
              x="205"
              y="85"
              width="165"
              height="78"
              rx="12"
              fill="{CARD}"
              stroke="{BORDER}"
            />

            <text
              x="222"
              y="111"
              class="label"
            >
              Stars
            </text>

            <text
              x="222"
              y="143"
              class="value"
            >
              {stars}
            </text>



            <rect
              x="385"
              y="85"
              width="165"
              height="78"
              rx="12"
              fill="{CARD}"
              stroke="{BORDER}"
            />

            <text
              x="402"
              y="111"
              class="label"
            >
              Contributions
            </text>

            <text
              x="402"
              y="143"
              class="value"
            >
              {contributions}
            </text>



            <rect
              x="565"
              y="85"
              width="170"
              height="78"
              rx="12"
              fill="{CARD}"
              stroke="{BORDER}"
            />

            <text
              x="582"
              y="111"
              class="label"
            >
              Followers
            </text>

            <text
              x="582"
              y="143"
              class="value"
            >
              {followers}
            </text>


            <!-- STREAK SECTION -->

            <rect
              x="25"
              y="180"
              width="350"
              height="100"
              rx="14"
              fill="{TEAL_DARK}"
              stroke="{TEAL}"
              stroke-opacity="0.35"
            />

            <text
              x="45"
              y="208"
              class="label"
            >
              Current Streak
            </text>

            <text
              x="45"
              y="247"
              class="streak"
            >
              {current_streak} days
            </text>


            <rect
              x="385"
              y="180"
              width="350"
              height="100"
              rx="14"
              fill="{TEAL_DARK}"
              stroke="{TEAL}"
              stroke-opacity="0.35"
            />

            <text
              x="405"
              y="208"
              class="label"
            >
              Highest Streak
            </text>

            <text
              x="405"
              y="247"
              class="streak"
            >
              {highest_streak} days
            </text>


            <!-- FOOTER -->

            <text
              x="32"
              y="315"
              class="small"
            >
              Commits: {commits}
              • Issues: {issues}
              • Pull Requests: {pull_requests}
            </text>


            <text
              x="32"
              y="337"
              class="small"
            >
              Top Languages:
              {escape(language_text)}
            </text>

          </svg>

          '''


          with open(
              "github-stats.svg",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(stats_svg)


          # =========================================================
          # ACTIVITY GRAPH
          # =========================================================

          # GitHub calendar already contains the weeks.
          # We use the complete contribution calendar.

          weeks = calendar["weeks"]


          cell = 13

          gap = 4

          left = 48

          top = 82


          graph_width = (

              left

              + len(weeks)
              * (cell + gap)

              + 35

          )


          graph_height = 245


          max_count = max(

              (

                  d["count"]

                  for d in days

              ),

              default=1

          )


          # =========================================================
          # CONTRIBUTION LEVEL
          # =========================================================

          def contribution_color(count):

              if count == 0:

                  return EMPTY


              ratio = (
                  count / max_count
              )


              if ratio < 0.20:

                  return "#064E45"


              if ratio < 0.40:

                  return "#087F70"


              if ratio < 0.60:

                  return "#00A991"


              if ratio < 0.80:

                  return "#00D6BA"


              return TEAL


          # =========================================================
          # ACTIVITY SVG
          # =========================================================

          activity = f'''

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="{graph_width}"
            height="{graph_height}"
            viewBox="0 0 {graph_width} {graph_height}"
          >

            <rect
              width="100%"
              height="100%"
              rx="20"
              fill="{BG}"
            />

            <rect
              x="1"
              y="1"
              width="{graph_width-2}"
              height="{graph_height-2}"
              rx="20"
              fill="none"
              stroke="{BORDER}"
              stroke-width="2"
            />


            <style>

              .title {{
                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;

                font-size:24px;

                font-weight:700;

                fill:{TEXT};
              }}


              .month {{
                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;

                font-size:11px;

                font-weight:600;

                fill:{MUTED};
              }}


              .footer {{
                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;

                font-size:12px;

                font-weight:500;

                fill:{MUTED};
              }}

            </style>


            <!-- TITLE -->

            <text
              x="28"
              y="40"
              class="title"
            >
              GitHub Activity
            </text>


            <text
              x="{graph_width-210}"
              y="40"
              class="footer"
            >
              {contributions} contributions
            </text>

          '''


          # =========================================================
          # MONTH LABELS
          # =========================================================

          previous_month = None


          for week_index, week in enumerate(weeks):

              if not week["contributionDays"]:

                  continue


              first_day = (
                  week["contributionDays"][0]
              )


              month = first_day["date"][:7]


              if month != previous_month:

                  x = (
                      left
                      + week_index
                      * (cell + gap)
                  )


                  month_name = date.fromisoformat(
                      first_day["date"]
                  ).strftime("%b")


                  activity += f'''

                  <text
                    x="{x}"
                    y="66"
                    class="month"
                  >
                    {month_name}
                  </text>

                  '''


                  previous_month = month


          # =========================================================
          # DAY LABELS
          # =========================================================

          activity += f'''

          <text
            x="16"
            y="{top + 13}"
            class="month"
          >
            Mon
          </text>

          <text
            x="16"
            y="{top + 41}"
            class="month"
          >
            Wed
          </text>

          <text
            x="16"
            y="{top + 69}"
            class="month"
          >
            Fri
          </text>

          '''


          # =========================================================
          # CONTRIBUTION CELLS
          # =========================================================

          for week_index, week in enumerate(weeks):

              for day_index, contribution_day in enumerate(
                  week["contributionDays"]
              ):

                  x = (
                      left
                      + week_index
                      * (cell + gap)
                  )


                  y = (
                      top
                      + day_index
                      * (cell + gap)
                  )


                  count = (
                      contribution_day[
                          "contributionCount"
                      ]
                  )


                  color = contribution_color(
                      count
                  )


                  tooltip = (

                      f'{contribution_day["date"]}: '

                      f'{count} contribution'

                      f'{"s" if count != 1 else ""}'

                  )


                  activity += f'''

                  <rect

                    x="{x}"

                    y="{y}"

                    width="{cell}"

                    height="{cell}"

                    rx="3"

                    fill="{color}"

                  >

                    <title>
                      {escape(tooltip)}
                    </title>

                  </rect>

                  '''


          # =========================================================
          # LEGEND
          # =========================================================

          legend_y = graph_height - 28


          activity += f'''

          <text
            x="{left}"
            y="{legend_y}"
            class="footer"
          >
            Less
          </text>

          <rect
            x="{left + 35}"
            y="{legend_y - 10}"
            width="12"
            height="12"
            rx="3"
            fill="{EMPTY}"
          />

          <rect
            x="{left + 52}"
            y="{legend_y - 10}"
            width="12"
            height="12"
            rx="3"
            fill="#064E45"
          />

          <rect
            x="{left + 69}"
            y="{legend_y - 10}"
            width="12"
            height="12"
            rx="3"
            fill="#087F70"
          />

          <rect
            x="{left + 86}"
            y="{legend_y - 10}"
            width="12"
            height="12"
            rx="3"
            fill="#00A991"
          />

          <rect
            x="{left + 103}"
            y="{legend_y - 10}"
            width="12"
            height="12"
            rx="3"
            fill="{TEAL}"
          />

          <text
            x="{left + 123}"
            y="{legend_y}"
            class="footer"
          >
            More
          </text>


          <text
            x="{graph_width - 250}"
            y="{legend_y}"
            class="footer"
          >
            🔥 {current_streak} day current streak
          </text>


          </svg>

          '''


          with open(
              "github-activity.svg",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(activity)


          print("===================================")
          print("GitHub Profile Graphics Generated")
          print("===================================")
          print("Repositories:", repository_count)
          print("Stars:", stars)
          print("Forks:", forks)
          print("Followers:", followers)
          print("Contributions:", contributions)
          print("Commits:", commits)
          print("Current Streak:", current_streak)
          print("Highest Streak:", highest_streak)
          print("===================================")

          PY


      - name: Commit updated SVG files

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-stats.svg github-activity.svg

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "chore: update GitHub profile graphics"

            git push

          fi
